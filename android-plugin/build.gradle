buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.slabgames.noctua.GodotNoctua"
    compileSdkVersion 36

    defaultConfig {
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
    }

    /*
     * Two flavors — one per supported Godot major version.
     *
     * godot3: targets Godot 3.6.x (plugin v1, minSdk 19)
     *         Godot AAR → libs/godot3/godot-lib*.aar
     *         Manifest  → src/godot3/AndroidManifest.xml (v1 meta-data)
     *
     * godot4: targets Godot 4.x   (plugin v2, minSdk 22)
     *         Godot AAR → libs/godot4/godot-lib*.aar
     *         Manifest  → src/godot4/AndroidManifest.xml (v2 meta-data)
     *
     * Build both:  ./gradlew assembleRelease
     * Build one:   ./gradlew assembleGodot4Release
     */
    flavorDimensions "godotVersion"
    productFlavors {
        godot3 {
            dimension "godotVersion"
            minSdkVersion 19
        }
        godot4 {
            dimension "godotVersion"
            minSdkVersion 22
        }
    }

    // Output names: GodotNoctua.godot3Release.aar / GodotNoctua.godot4Release.aar
    libraryVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "GodotNoctua.${variant.name}.aar"
        }
    }
}

dependencies {
    /*
     * Godot Android library — compile-only so it is NOT bundled in the AAR.
     * Godot itself provides this at runtime.
     *
     * Download the matching AAR from https://github.com/godotengine/godot/releases
     *   Godot 3.x: godot-lib-3.6.2.stable.template_release.aar → libs/godot3/
     *   Godot 4.x: godot-lib-4.x.x.stable.template_release.aar → libs/godot4/
     */
    godot3CompileOnly fileTree(dir: 'libs/godot3', include: ['godot-lib*.aar'])
    godot4CompileOnly fileTree(dir: 'libs/godot4', include: ['godot-lib*.aar'])

    implementation("com.noctuagames.sdk:noctua-android-sdk:0.35.1")
}

ext {
    artifact = 'godot-noctua'
}
